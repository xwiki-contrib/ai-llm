networks:
  bridge:
    driver: bridge
services:
  # The container that runs XWiki in Tomcat, with the appropriate JDBC driver (for postgres).
  web:
    image: "xwikicontrib/ai-llm:${LLM_VERSION}-${XWIKI_VERSION}-postgres-tomcat"
    container_name: xwiki-postgres-tomcat-web
    # Run an init process (tini) as PID 1 instead of the JVM, so that processes reparented to PID 1 get reaped. The JVM
    # (our PID 1 without this) never reaps children, so any process orphaned in the container (e.g. LibreOffice children
    # left behind when soffice.bin restarts) would otherwise linger as <defunct> zombies forever (see XDOCKER-53).
    init: true
    depends_on:
      - db
    ports:
      - "8080:8080"
    # Default values defined in .env file.
    # The DB_USER/DB_PASSWORD/DB_DATABASE/DB_HOST variables are used in the hibernate.cfg.xml file.
    environment:
      - XWIKI_VERSION=${XWIKI_VERSION}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - DB_HOST=xwiki-postgres-db
    # Provide a name instead of an auto-generated id for xwiki data (the permanent directory in included in it)
    # configured in the Dockerfile, to make it simpler to identify in 'docker volume ls'.
    volumes:
      - xwiki-data:/usr/local/xwiki
    networks:
      - bridge
  # The container that runs the database (postgres)
  # The image is pinned to the major that the "latest" tag of the official image resolves to, which is the version
  # XWiki validates as its supported database configuration. The pin keeps the stack reproducible and lets Renovate
  # propose the next major as a pull request, instead of a major database upgrade reaching the data volume silently on
  # the next pull.
  db:
    image: "postgres:18"
    container_name: xwiki-postgres-db
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale-provider=builtin --locale=C.UTF-8
    networks:
      - bridge
  # The container for the default inference engine
  ollama:
    # Pinned to a release instead of 'latest': a stale cached 'latest' may be too old to pull the models below
    # (Ollama answers HTTP 412 when a model needs a newer server), and the pull failure does not stop the container.
    # Bump the pin when upgrading the models.
    image: "ollama/ollama:0.40.13"
    container_name: ollama
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - bridge
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        sleep 10
        ollama pull all-minilm
        ollama pull gemma4:e4b
        wait
volumes:
  postgres-data: {}
  xwiki-data: {}
  ollama: {}
